name: CI

on:
  push:
    branches: [v2.0.0]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # what a release would stop on, found at the push instead
      - name: Type check
        run: npm run typecheck

      # every built-in look readable (WCAG AA), derived looks stable, the theme JSON contract, the engine's class inventory
      - name: Themes
        run: npm run check:themes

      - name: Build the dashboard
        run: npm run build:renderer
