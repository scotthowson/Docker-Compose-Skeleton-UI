name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: AppImage
            artifact: appimage
          - target: deb
            artifact: deb
          - target: rpm
            artifact: rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

      - name: Install RPM tools (for rpm target)
        if: matrix.target == 'rpm'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build main process
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (${{ matrix.target }})
        run: npx electron-builder --linux ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build main process
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (NSIS)
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-nsis
          path: |
            release/*.exe
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default list still names the retired "tools" package,
          # which sdkmanager no longer offers; ask only for what the app needs
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/DCS-Manager-${VERSION}-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/DCS-Manager-*-android.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.apk
          generate_release_notes: true
          # A tag with a dash (vX.Y.Z-rc.N) is a pre-release: it is never the "latest release" and never reaches the ones on the stable channel
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
