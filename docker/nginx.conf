server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # HSTS — only effective behind Traefik/TLS but harmless otherwise
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── SPA Routing ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Reverse Proxy ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://DCS_API_HOST_PLACEHOLDER:DCS_API_PORT_PLACEHOLDER/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;

        # Limit request body (prevent abuse)
        client_max_body_size 10m;
    }

    # ── Favicon ───────────────────────────────────────────────────
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # ── Static Asset Caching ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Block dot files (except .well-known) ──────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
