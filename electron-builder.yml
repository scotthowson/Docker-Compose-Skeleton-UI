appId: com.dcs.skeleton-ui
productName: Docker Compose Skeleton UI
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  synopsis: Docker Compose Skeleton management dashboard
  description: Premium desktop application for managing Docker Compose Skeleton servers with live monitoring, stack management, health checks, and more.
  desktop:
    Name: DCS Manager
    Comment: Docker Compose Skeleton UI
    Categories: Development;System;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
mac:
  icon: build/icon.png
  target:
    - dmg
win:
  icon: build/icon.png
  target:
    - nsis
