<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DCS notifications avatar: the compose stack, and the bell that rings in your channel -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#050a14"/></linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.75"><stop offset="0" stop-color="#34d399" stop-opacity="0.32"/><stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/></radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="0.55" stop-color="#10b981"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="midFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#0e7490" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="lowFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94a3b8" stop-opacity="0.32"/><stop offset="1" stop-color="#475569" stop-opacity="0.28"/></linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="url(#edgeLight)" stroke-width="6"/>
  <g transform="translate(470 420) scale(0.82)">
    <ellipse cx="0" cy="304" rx="250" ry="52" fill="#000000" fill-opacity="0.45" filter="url(#soft)"/>
    <g transform="translate(0 180)"><path d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#lowFace)" stroke="#cbd5e1" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/></g>
    <g transform="translate(0 90)"><path d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#midFace)" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/></g>
    <g transform="translate(0 0)">
      <path d="M-262 0 L0 -131 L262 0 L0 131 Z" fill="url(#topFace)" stroke="#d1fae5" stroke-opacity="0.9" stroke-width="7" stroke-linejoin="round"/>
      <path d="M-262 0 L0 -131 L262 0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#022c22" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round"><line x1="-92" y1="-14" x2="40" y2="52"/><line x1="-30" y1="-60" x2="102" y2="6"/><line x1="-154" y1="34" x2="-46" y2="88"/></g>
    </g>
    <circle cx="0" cy="-131" r="16" fill="#a7f3d0" filter="url(#dotGlow)" fill-opacity="0.9"/><circle cx="0" cy="-131" r="11" fill="#a7f3d0"/>
    <circle cx="-262" cy="0" r="12" fill="#67e8f9" filter="url(#dotGlow)"/><circle cx="-262" cy="0" r="9" fill="#a5f3fc"/>
    <circle cx="262" cy="0" r="12" fill="#67e8f9" filter="url(#dotGlow)"/><circle cx="262" cy="0" r="9" fill="#a5f3fc"/>
  </g>
  <circle cx="742" cy="742" r="196" fill="#000000" fill-opacity="0.5" filter="url(#badgeShadow)"/>
  <circle cx="742" cy="742" r="186" fill="#0b1220"/>
  <circle cx="742" cy="742" r="186" fill="none" stroke="url(#amber)" stroke-width="14"/>
  <g transform="translate(742 748)">
    <path d="M-92 46 L-70 22 V-30 A70 70 0 0 1 70 -30 V22 L92 46 Z" fill="url(#amber)" stroke="#fde68a" stroke-opacity="0.6" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-100" y="46" width="200" height="16" rx="8" fill="url(#amber)"/>
    <path d="M-34 74 A34 30 0 0 0 34 74 Z" fill="url(#amber)"/>
    <circle cx="0" cy="-112" r="14" fill="#fde68a"/>
    <path d="M96 -74 a92 92 0 0 1 22 40" fill="none" stroke="#fde68a" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"/>
    <path d="M-96 -74 a92 92 0 0 0 -22 40" fill="none" stroke="#fde68a" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="742" cy="742" r="186" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
</svg>
